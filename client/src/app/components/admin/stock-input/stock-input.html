<input
  type="number"
  min="0"
  [value]="draft()"
  [disabled]="saving()"
  (input)="onDraftChange($any($event.target).value)"
  (blur)="commit()"
  (keydown)="onKeydown($event)"
  class="w-12 rounded-full bg-slate-100 px-1.5 py-0.5 text-center text-slate-900 focus:outline-none disabled:opacity-50"
/>
